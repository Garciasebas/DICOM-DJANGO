{% extends 'base.html' %}

{% block content %}
    <div class="main-card upload-card" style="max-width:500px;">
        <h2 class="mb-4 text-center" style="font-weight:700;">
            {% if object %}Editar{% else %}Subir{% endif %} Archivo DICOM
        </h2>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success w-100 fw-bold">
                {% if object %}Actualizar{% else %}Subir{% endif %}
            </button>
        </form>
        <a href="{% url 'dicomfile_list' %}" class="btn btn-outline-secondary w-100 mt-3 fw-bold">
            Cancelar
        </a>
    </div>
{% endblock %}
