{% extends 'base.html' %}

{% block content %}
  <h1>{% if object %}Editar{% else %}Subir{% endif %} Archivo DICOM</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object %}Actualizar{% else %}Subir{% endif %}</button>
  </form>
  <a href="{% url 'dicomfile_list' %}">Cancelar</a>
{% endblock %}
