{% extends 'base.html' %}

{% block content %}

<div class="delete-modal-container">
    <div class="delete-modal">
        <div class="dashboard-header-top">
            <div class="dashboard-brand">DICOM HUB</div>
        </div>
        <h2 class="delete-modal-title">Confirmar Eliminación</h2>

        <p class="delete-modal-text">
            ¿Estás seguro de que deseas eliminar el experimento
        </p>

        <p class="delete-modal-filename">
            "{{ object.name }}"?
        </p>

        <form method="post" class="delete-modal-actions">
            {% csrf_token %}
            <button type="submit" class="btn-delete-red">
                <i class="fas fa-trash-can"></i> Eliminar
            </button>
            <a href="{% url 'experiment_detail' object.pk %}" class="btn-cancel-outline">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
