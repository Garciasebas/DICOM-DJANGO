{% extends 'base.html' %}

{% block content %}
    <div class="upload-card main-card">
        <h1 class="upload-title">Subir nuevo DICOM</h1>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors|striptags }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-custom w-100 mt-3">⬆️ Subir DICOM</button>
        </form>
    </div>
{% endblock %}
