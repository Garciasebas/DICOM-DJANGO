<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DICOM HUB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f5faff 100%);
            min-height: 100vh;
        }
        .brand {
            font-size: 2rem;
            font-weight: 900;
            color: #6366f1;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none !important;
            display: block;
            transition: color 0.2s;
        }
        .brand:hover {
            color: #312e81;
        }
        /* Tarjeta base para todas las vistas principales */
        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.09);
            padding: 2.5rem 2rem;
            margin: 60px auto 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cambié div por a, ahora es clickeable -->
        <a href="{% url 'main_menu' %}" class="brand">DICOM HUB</a>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
